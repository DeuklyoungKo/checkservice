name: Trend Data Collection

on:
  # [동결] 2026-06-29: 실험 종료에 따라 자동 수집 중단 — AI 분석 비용 차단을 위해 cron 비활성화.
  # 개인용 온디맨드 수집이 필요하면 Actions 탭에서 수동 실행(workflow_dispatch)으로만 돌린다.
  # schedule:
  #   - cron: '0 */2 * * *'
  workflow_dispatch: # 수동 실행 지원 (개인용 온디맨드)

jobs:
  collect-trends:
    runs-on: ubuntu-latest
    environment: trendscouter    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: trend-scouter/package-lock.json

      - name: Install dependencies
        run: |
          cd trend-scouter
          npm install
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: Check Secrets
        run: |
          echo "SUPABASE_URL set: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL != '' }}"
          echo "SERVICE_KEY set: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY != '' }}"
          echo "MINIMAX_KEY set: ${{ secrets.MINIMAX_API_KEY != '' }}"
          echo "NAVER_CLIENT_ID set: ${{ secrets.NAVER_CLIENT_ID != '' }}"
          echo "NAVER_CLIENT_SECRET set: ${{ secrets.NAVER_CLIENT_SECRET != '' }}"

      - name: Run RSS Collector
        run: |
          cd trend-scouter
          node scripts/rss-collector.js
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
