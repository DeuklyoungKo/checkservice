name: Trend Data Collection

on:
  # ⛔ 자동 수집 일시 중지 (2026-06-22) — Gemini 출혈 차단.
  # 사유: DeepSeek 미충전 → 전량 Gemini 폴백으로 하루 ~1만원 소진. DeepSeek 충전 후 아래 schedule 주석 해제.
  # schedule:
  #   - cron: '0 */2 * * *' # 2시간마다 실행 (Gemini 무료 티어 RPD 절약)
  workflow_dispatch: # 수동 실행 지원 (필요 시 수동으로만 실행)

jobs:
  collect-trends:
    runs-on: ubuntu-latest
    environment: trendscouter    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: trend-scouter/package-lock.json

      - name: Install dependencies
        run: |
          cd trend-scouter
          npm install
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: Check Secrets
        run: |
          echo "SUPABASE_URL set: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL != '' }}"
          echo "SERVICE_KEY set: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY != '' }}"
          echo "DEEPSEEK_KEY set: ${{ secrets.DEEPSEEK_API_KEY != '' }}"
          echo "GEMINI_KEY set: ${{ secrets.GEMINI_API_KEY != '' }}"
          echo "NAVER_CLIENT_ID set: ${{ secrets.NAVER_CLIENT_ID != '' }}"
          echo "NAVER_CLIENT_SECRET set: ${{ secrets.NAVER_CLIENT_SECRET != '' }}"

      - name: Run RSS Collector
        run: |
          cd trend-scouter
          node scripts/rss-collector.js
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
